<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datos de España: salarios, IPC y PIB</title>
  <meta name="description" content="Explora y compara salarios, IPC y PIB de España con gráficos interactivos y explicaciones en lenguaje llano.">
  <meta name="color-scheme" content="light dark">
  <script>
    // aplica el tema guardado antes de pintar para evitar un parpadeo
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    try { if (localStorage.getItem('lang') === 'en') document.documentElement.lang = 'en'; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
